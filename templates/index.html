<!DOCTYPE html>
<html>
<head>
    <title>AI Depth Vision</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .start {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }
        
        .start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }
        
        .stop {
            background: linear-gradient(45deg, #f44336, #da190b);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }
        
        .stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.6);
        }
        
        #status {
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .video-box {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .video-box h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .video-box img {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        
        .video-box img:hover {
            transform: scale(1.05);
        }
        
        .legend {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .legend h3 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .colorbar {
            height: 30px;
            background: linear-gradient(to right, 
                #000000 0%, #1a0033 10%, #4a0080 20%, #7300cc 30%, 
                #9900ff 40%, #cc3300 50%, #ff6600 60%, #ff9900 70%, 
                #ffcc00 80%, #ffff00 90%, #ffffff 100%);
            border-radius: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .depth-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Depth Vision</h1>
            <p>Real-time depth estimation powered by artificial intelligence</p>
        </div>
        
        <div class="controls">
            <button class="start" onclick="startCamera()">🎥 Start Camera</button>
            <button class="stop" onclick="stopCamera()">⏹️ Stop Camera</button>
        </div>
        
        <div id="status" class="pulse">Ready to start AI depth estimation</div>
        
        <div class="video-container">
            <div class="video-box">
                <h3>📷 Original Feed</h3>
                <img id="original" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQwIiBoZWlnaHQ9IjQ4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiM2NjdlZWEiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM3NjRiYTIiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2cpIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5XYWl0aW5nLi4uPC90ZXh0Pjwvc3ZnPg==">
            </div>
            <div class="video-box">
                <h3>🔥 AI Depth Map</h3>
                <img id="depth" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQwIiBoZWlnaHQ9IjQ4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiM2NjdlZWEiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM3NjRiYTIiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2cpIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5XYWl0aW5nLi4uPC90ZXh0Pjwvc3ZnPg==">
            </div>
        </div>
        
        <div class="legend">
            <h3>🌡️ Depth Color Legend</h3>
            <div class="colorbar"></div>
            <div class="depth-labels">
                <span>Far (Black/Purple)</span>
                <span>Medium (Red/Orange)</span>
                <span>Near (Yellow/White)</span>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let frameInterval;

        function startCamera() {
            document.getElementById('status').textContent = 'Starting camera and loading AI model...';
            document.getElementById('status').className = 'pulse';
            
            fetch('/start')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        isRunning = true;
                        document.getElementById('status').textContent = 'AI depth estimation active';
                        document.getElementById('status').className = '';
                        frameInterval = setInterval(updateFrame, 300); // ~3 FPS for AI processing
                    } else {
                        document.getElementById('status').textContent = 'Failed to start camera';
                        document.getElementById('status').className = '';
                    }
                });
        }

        function stopCamera() {
            fetch('/stop')
                .then(r => r.json())
                .then(data => {
                    isRunning = false;
                    clearInterval(frameInterval);
                    document.getElementById('status').textContent = 'Camera stopped';
                    document.getElementById('status').className = '';
                });
        }

        function updateFrame() {
            if (!isRunning) return;
            
            fetch('/frame')
                .then(r => r.json())
                .then(data => {
                    if (data.original && data.depth) {
                        document.getElementById('original').src = data.original;
                        document.getElementById('depth').src = data.depth;
                        document.getElementById('status').textContent = 'AI processing active';
                    } else if (data.error) {
                        document.getElementById('status').textContent = data.error;
                    }
                })
                .catch(e => {
                    console.log('Frame error:', e);
                    document.getElementById('status').textContent = 'Connection error';
                });
        }
    </script>
</body>
</html>
