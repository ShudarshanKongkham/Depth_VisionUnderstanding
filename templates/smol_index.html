<!DOCTYPE html>
<html>
<head>
    <title>🧠 Neural Vision AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 80%, #120458 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, #421a7a 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, #1a0b3d 0%, transparent 50%);
            min-height: 100vh;
            color: #00ff88;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto;
            position: relative;
        }
        
        .neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .neural-node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse-node 3s infinite;
        }
        
        @keyframes pulse-node {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3.5em;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ff88, #00ccff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            animation: glow-text 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow-text {
            from { filter: drop-shadow(0 0 20px #00ff88); }
            to { filter: drop-shadow(0 0 40px #00ccff); }
        }
        
        .header p {
            font-size: 1.4em;
            color: #00ccff;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: 2px solid;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: 600;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            background: transparent;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        .start {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        
        .start:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
            transform: translateY(-3px);
        }
        
        .analyze {
            border-color: #00ccff;
            color: #00ccff;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3);
        }
        
        .analyze:hover {
            background: rgba(0, 204, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 204, 255, 0.6);
            transform: translateY(-3px);
        }
        
        .stop {
            border-color: #ff0080;
            color: #ff0080;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.3);
        }
        
        .stop:hover {
            background: rgba(255, 0, 128, 0.1);
            box-shadow: 0 0 40px rgba(255, 0, 128, 0.6);
            transform: translateY(-3px);
        }
        
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        
        #status {
            text-align: center;
            padding: 20px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.3);
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            position: relative;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .camera-section {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 136, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .camera-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00ff88, #00ccff, #ff0080, #00ff88);
            animation: scan-line 2s linear infinite;
        }
        
        @keyframes scan-line {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .camera-header {
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
        }
        
        .camera-header h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5em;
            color: #00ff88;
            margin: 0;
        }
        
        .camera-display {
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        #camera {
            width: 100%;
            max-width: 100%;
            border: 2px solid rgba(0, 255, 136, 0.5);
            filter: contrast(1.1) brightness(1.1);
            position: relative;
        }
        
        .analysis-panel {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 204, 255, 0.3);
            display: flex;
            flex-direction: column;
        }
        
        .analysis-header {
            padding: 20px;
            background: rgba(0, 204, 255, 0.1);
            border-bottom: 1px solid rgba(0, 204, 255, 0.3);
        }
        
        .analysis-header h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5em;
            color: #00ccff;
            margin: 0;
        }
        
        .analysis-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        #analysis {
            background: rgba(0, 204, 255, 0.05);
            border: 1px solid rgba(0, 204, 255, 0.2);
            padding: 20px;
            color: #00ccff;
            font-size: 16px;
            line-height: 1.6;
            min-height: 200px;
            flex: 1;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 400;
        }
        
        .pulse {
            animation: pulse-glow 1.5s infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.8); }
        }
        
        .analyzing {
            animation: analyzing-glow 1s infinite;
        }
        
        @keyframes analyzing-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 204, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 204, 255, 0.8); }
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2.5em;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
        
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
        }
    </style>
</head>
<body>
    <div class="neural-bg"></div>
    
    <div class="container">
        <div class="header">
            <h1>🧠 NEURAL VISION</h1>
            <p>ADVANCED AI PERCEPTION SYSTEM</p>
        </div>
        
        <div class="controls">
            <button class="start" onclick="startCamera()">⚡ INITIALIZE</button>
            <button class="analyze" id="analyzeBtn" onclick="analyzeFrame()" disabled>🔬 ANALYZE</button>
            <button class="stop" onclick="stopCamera()">⏹ TERMINATE</button>
        </div>
        
        <div id="status" class="pulse">LOADING NEURAL NETWORK...</div>
        
        <div class="main-grid">
            <div class="camera-section">
                <div class="camera-header">
                    <h3>📡 VISUAL INPUT STREAM</h3>
                </div>
                <div class="camera-display">
                    <img id="camera" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQwIiBoZWlnaHQ9IjQ4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiMwMGZmODgiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiMwMGNjZmYiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2cpIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJPcmJpdHJvbiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzBhMGEwYSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkFXQUlUSU5HIElOUFVULi4uPC90ZXh0Pjwvc3ZnPg==">
                </div>
            </div>
            
            <div class="analysis-panel">
                <div class="analysis-header">
                    <h3>🤖 AI COGNITION</h3>
                </div>
                <div class="analysis-content">
                    <div id="analysis">NEURAL NETWORK READY FOR ANALYSIS</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let frameInterval;

        // Create neural network background
        function createNeuralNodes() {
            const bg = document.querySelector('.neural-bg');
            for (let i = 0; i < 50; i++) {
                const node = document.createElement('div');
                node.className = 'neural-node';
                node.style.left = Math.random() * 100 + '%';
                node.style.top = Math.random() * 100 + '%';
                node.style.animationDelay = Math.random() * 3 + 's';
                bg.appendChild(node);
            }
        }

        createNeuralNodes();
        checkModelStatus();

        function checkModelStatus() {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    if (data.model_loaded) {
                        document.getElementById('status').textContent = 'NEURAL NETWORK ONLINE';
                        document.getElementById('status').className = '';
                    } else {
                        document.getElementById('status').textContent = 'LOADING NEURAL NETWORK...';
                        document.getElementById('status').className = 'pulse';
                        setTimeout(checkModelStatus, 2000);
                    }
                })
                .catch(e => {
                    document.getElementById('status').textContent = 'CONNECTION ERROR';
                    setTimeout(checkModelStatus, 3000);
                });
        }

        function startCamera() {
            document.getElementById('status').textContent = 'INITIALIZING VISUAL SENSORS...';
            
            fetch('/start')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        isRunning = true;
                        document.getElementById('analyzeBtn').disabled = false;
                        frameInterval = setInterval(updateFrame, 100);
                        document.getElementById('status').textContent = 'VISUAL STREAM ACTIVE';
                    } else {
                        document.getElementById('status').textContent = 'SENSOR INITIALIZATION FAILED';
                    }
                })
                .catch(e => {
                    document.getElementById('status').textContent = 'CONNECTION ERROR';
                });
        }

        function stopCamera() {
            fetch('/stop')
                .then(r => r.json())
                .then(data => {
                    isRunning = false;
                    document.getElementById('analyzeBtn').disabled = true;
                    clearInterval(frameInterval);
                    document.getElementById('status').textContent = 'VISUAL STREAM TERMINATED';
                })
                .catch(e => {
                    document.getElementById('status').textContent = 'TERMINATION ERROR';
                });
        }

        function updateFrame() {
            if (!isRunning) return;
            
            fetch('/frame')
                .then(r => r.json())
                .then(data => {
                    if (data.frame) {
                        document.getElementById('camera').src = data.frame;
                    }
                })
                .catch(e => console.log('Frame error:', e));
        }

        function analyzeFrame() {
            const btn = document.getElementById('analyzeBtn');
            const analysis = document.getElementById('analysis');
            
            btn.disabled = true;
            btn.textContent = '🔬 PROCESSING...';
            analysis.textContent = 'NEURAL ANALYSIS IN PROGRESS...';
            analysis.className = 'analyzing';
            
            console.log('Starting analysis...');
            
            fetch('/analyze')
                .then(r => {
                    console.log('Response received:', r.status);
                    return r.json();
                })
                .then(data => {
                    console.log('Analysis data:', data);
                    analysis.textContent = data.result || 'ANALYSIS COMPLETE - NO DATA';
                    analysis.className = '';
                    btn.disabled = false;
                    btn.textContent = '🔬 ANALYZE';
                })
                .catch(e => {
                    console.error('Analysis error:', e);
                    analysis.textContent = 'NEURAL ANALYSIS FAILED - SYSTEM ERROR';
                    analysis.className = '';
                    btn.disabled = false;
                    btn.textContent = '🔬 ANALYZE';
                });
        }
    </script>
</body>
</html>
